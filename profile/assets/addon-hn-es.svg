<svg xmlns="http://www.w3.org/2000/svg" width="434" height="214" viewBox="0 0 434 214" role="img" aria-label="HandyNotes: Dungeon &amp; Raid Locations: Todas las entradas de mazmorras y bandas en el mapa de zona, continente y minimapa.">
  <defs>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11142a"/><stop offset="1" stop-color="#070812"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd100" stop-opacity="0"/><stop offset=".5" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd100" stop-opacity="0"/></linearGradient>
    <linearGradient id="goldtext" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffd100"/><stop offset="1" stop-color="#c8860a"/></linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <style>
    text { font-family: Verdana, 'DejaVu Sans', Arial, sans-serif; font-size: 14px; fill: #fff; }
    .t { font-family: Georgia, 'Times New Roman', serif; font-weight: bold; }
    .l { opacity: 0; animation: in .45s ease-out forwards; }
    .glint { animation: run 7s linear infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .glint, .fx { animation: none !important; opacity: 1 !important; } }</style>
<g transform="translate(12 16)">
  <rect x="1" y="1" width="408" height="180" rx="8" fill="url(#tip)" stroke="#4a4f6a" stroke-width="2"/>

  <rect x="14" y="14" width="46" height="46" rx="5" fill="url(#gem)" stroke="#ff8000" stroke-width="2"/>
  <text class="t" x="37" y="44" text-anchor="middle" style="font-size:18px; fill:#ff8000">HN</text>
  <text class="l t" x="72" y="34" style="animation-delay:0.1s; font-size:14px; fill:#ff8000">HandyNotes: Dungeon &amp; Raid Locations</text>
  <text class="l " x="72" y="55" style="animation-delay:0.2s; font-size:13px">Mapa</text>
  <text class="l" x="394" y="55" text-anchor="end" style="font-size:13px; animation-delay:.2s">v1.03</text>
  <text class="l " x="16" y="90" style="animation-delay:0.3s; fill:#1eff00; font-size:13px">Equipar: Todas las entradas de mazmorras y bandas</text>
  <text class="l " x="16" y="109" style="animation-delay:0.3s; fill:#1eff00; font-size:13px">en el mapa de zona, continente y minimapa.</text>
  <text class="l " x="16" y="138" style="animation-delay:0.4s; font-size:13px">Forever</text>
  <text class="l " x="16" y="164" style="animation-delay:0.5s; fill:#c9c9c9; font-size:13px">Descargas: <tspan fill="#ffd100">26.355</tspan></text></g>
</svg>
