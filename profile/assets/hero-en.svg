  <text class="l" x="806" y="130" text-anchor="end" style="animation-delay:.6s">Interface</text>
  <text class="l " x="128" y="164" style="animation-delay:0.80s; ">+22 Addons</text>
  <text class="l " x="128" y="188" style="animation-delay:0.95s; ">+271,388 Downloads</text>
  <text class="l " x="128" y="212" style="animation-delay:1.10s; ">+8 Game clients</text>
  <text class="l " x="128" y="254" style="animation-delay:1.40s; fill:#1eff00; ">Equip: A lighter, cleaner and smarter UI for every playstyle.</text>
  <text class="l " x="128" y="278" style="animation-delay:1.60s; fill:#1eff00; ">Equip: Retail, Classic and WoW Forever.</text>
  <text class="l " x="128" y="302" style="animation-delay:1.80s; fill:#1eff00; ">Use: Install from CurseForge in one click.</text>
  <text class="l " x="128" y="344" style="animation-delay:2.1s; ">Durability 100 / 100</text>
