    <rect x="66" y="16" width="708" height="72" rx="36" fill="none" stroke="#4a4f6a"/>
    <circle cx="104" cy="52" r="30" fill="url(#gem)" stroke="url(#goldtext)" stroke-width="3"/>
    <text class="t" x="104" y="60" text-anchor="middle" style="font-size:22px; fill:url(#goldtext)">50</text>
    <text x="440" y="36" text-anchor="middle" style="font-size:12px; fill:#ffd100; letter-spacing:1px">LOGRO CONSEGUIDO</text>
    <text class="t" x="440" y="62" text-anchor="middle" style="font-size:22px">250.000 descargas</text>
    <text x="440" y="82" text-anchor="middle" style="font-size:13px; fill:#c9c9c9">Alcanza 250.000 descargas en CurseForge.</text>
