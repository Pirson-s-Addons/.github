    <rect x="66" y="116" width="708" height="72" rx="36" fill="none" stroke="#4a4f6a"/>
    <circle cx="104" cy="152" r="30" fill="url(#gem)" stroke="url(#goldtext)" stroke-width="3"/>
    <text class="t" x="104" y="160" text-anchor="middle" style="font-size:22px; fill:url(#goldtext)">25</text>
    <text x="440" y="136" text-anchor="middle" style="font-size:12px; fill:#ffd100; letter-spacing:1px">LOGRO CONSEGUIDO</text>
    <text class="t" x="440" y="162" text-anchor="middle" style="font-size:22px">El favorito del público</text>
    <text x="440" y="182" text-anchor="middle" style="font-size:13px; fill:#c9c9c9">WoW Translator: 78.866 descargas.</text>
