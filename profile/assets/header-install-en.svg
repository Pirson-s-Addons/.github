<svg xmlns="http://www.w3.org/2000/svg" width="840" height="60" viewBox="0 0 840 60" role="img" aria-label="Installation">
  <defs>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11142a"/><stop offset="1" stop-color="#070812"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd100" stop-opacity="0"/><stop offset=".5" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd100" stop-opacity="0"/></linearGradient>
    <linearGradient id="goldtext" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffd100"/><stop offset="1" stop-color="#c8860a"/></linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <style>
    text { font-family: Verdana, 'DejaVu Sans', Arial, sans-serif; font-size: 14px; fill: #fff; }
    .t { font-family: Georgia, 'Times New Roman', serif; font-weight: bold; }
    .l { opacity: 0; animation: in .45s ease-out forwards; }
    .glint { animation: run 7s linear infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .glint, .fx { animation: none !important; opacity: 1 !important; } }</style>

  <rect x="1" y="1" width="838" height="58" rx="10" fill="url(#tip)" stroke="#4a4f6a"/>
  <line x1="40" y1="30" x2="290" y2="30" stroke="#ffd100" stroke-opacity=".7" stroke-width="1.5"/><path d="M290 30 l6 -6 l6 6 l-6 6 Z" fill="#ffd100" transform="translate(0 0)"/>
  <line x1="800" y1="30" x2="550" y2="30" stroke="#ffd100" stroke-opacity=".7" stroke-width="1.5"/><path d="M550 30 l6 -6 l6 6 l-6 6 Z" fill="#ffd100" transform="translate(-12 0)"/>
  <text class="t" x="420" y="39" text-anchor="middle" style="font-size:26px; fill:url(#goldtext); letter-spacing:1px">Installation</text>
</svg>
