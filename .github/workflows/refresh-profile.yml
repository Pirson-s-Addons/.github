name: Refresh profile

# Weekly: CurseForge downloads + versions and each repo's game clients, then redraws profile/assets and both READMEs.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch data and build
        run: node scripts/build.mjs --fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add profile
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile numbers"
            git push
          fi
